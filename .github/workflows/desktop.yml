name: Desktop packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            certificate: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/desktop/validateRelease.mjs
      - run: npm ci --ignore-scripts
      - name: Install SQLite Node-API binary for tests
        run: node ../prebuild-install/bin.js -r napi
        working-directory: node_modules/sqlite3
      - run: npm run check:architecture
      - run: npm run check:docs
      - run: npm run check:conventions
      - run: npm run check:local-only
      - run: npm run typecheck
      - run: npm run unit -- --testTimeout=30000
      - name: Build installers and update metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # Missing GitHub Secrets become empty strings; builder treats an empty CSC_LINK as a file path.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npm run desktop:package:${{ matrix.target }}
        env:
          NAKO_UPDATE_URL: ${{ vars.NAKO_UPDATE_URL }}
          CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Sign Sparkle update archive and appcast
        if: github.event_name != 'pull_request' && matrix.target == 'mac'
        run: node scripts/desktop/generateSparkleAppcast.mjs
        env:
          NAKO_UPDATE_URL: ${{ vars.NAKO_UPDATE_URL }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - run: npm run desktop:smoke
        if: github.event_name != 'pull_request'
      - name: Fetch pinned Sparkle native integration tests
        if: github.event_name != 'pull_request' && matrix.target == 'mac'
        uses: actions/checkout@v6
        with:
          repository: Innei/electron-sparkle-updater
          ref: 57975bd3b851713fe9d27d756574578a613ace19
          path: .verification/sparkle-upstream
          persist-credentials: false
      - name: Verify native ad-hoc signed cross-version installation
        if: github.event_name != 'pull_request' && matrix.target == 'mac'
        run: >-
          python3 .verification/sparkle-upstream/native/tests/integration.py
          --framework .packaging/app/node_modules/electron-sparkle-updater/native/vendor/Sparkle.framework
          --tools .packaging/app/node_modules/electron-sparkle-updater/native/vendor/bin
      - name: Stage verified platform assets in draft Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: node scripts/desktop/stageRelease.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Upload smoke test diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            .verification/packaged-*/result.json
            .verification/packaged-*/*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Publish complete private release
        run: node scripts/desktop/publishRelease.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
