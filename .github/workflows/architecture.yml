name: Architecture
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  architecture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:architecture
      - run: npm run check:local-only
      - run: npm run unit -- tests/architecture-rules.test.js tests/drama-parser-order.test.js --testTimeout=30000
